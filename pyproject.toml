[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-apple-mail"
version = "3.3.0"
description = "MCP server giving AI assistants full access to Apple Mail - read, search, compose, organize & analyze emails"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [
    { name = "Patrick Freyer" },
]
keywords = [
    "mcp",
    "mcp-server",
    "apple-mail",
    "email",
    "ai",
    "claude",
    "automation",
    "macos",
    "applescript",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
]
dependencies = [
    "fastmcp>=4.0.0,<5",
    "mcp-ui-server>=1.0.0",
]

[project.scripts]
mcp-apple-mail = "apple_mail_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/patrickfreyer/apple-mail-mcp"
Repository = "https://github.com/patrickfreyer/apple-mail-mcp"
Issues = "https://github.com/patrickfreyer/apple-mail-mcp/issues"
Changelog = "https://github.com/patrickfreyer/apple-mail-mcp/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["plugin/apple_mail_mcp", "plugin/ui"]

[tool.hatch.build.targets.sdist]
include = ["plugin/apple_mail_mcp/**"]

[dependency-groups]
dev = ["ruff>=0.17.2", "pytest>=9"]

[tool.ruff]
target-version = "py314"
line-length = 120
exclude = [".claude/", "apple_mail_mcp"]
