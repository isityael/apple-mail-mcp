when:
  - event: manual
  - event: [push, pull_request]
    branch: main
  - event: tag

steps:
  - name: lint
    image: dhi.io/uv:0.11.28-debian13-dev@sha256:b46b0147e186885eb351623ed20e24d6b6f1d2e23c8fb9897c972092f589ca61
    environment:
      UV_PROJECT_ENVIRONMENT: /tmp/venv
    commands:
      - uv sync --frozen
      - uv run ruff check .
      - uv run ruff format --check .

  - name: check
    image: dhi.io/uv:0.11.28-debian13-dev@sha256:b46b0147e186885eb351623ed20e24d6b6f1d2e23c8fb9897c972092f589ca61
    environment:
      UV_PROJECT_ENVIRONMENT: /tmp/venv
    commands:
      - uv sync --frozen
      - uv run python -c "import apple_mail_mcp"
      - uv run python scripts/check_versions.py
      - uv run python scripts/check_mcpb_manifest.py
      - uv run python scripts/check_codex_plugin_export.py
      - |
        for t in tests/test_*.py; do
          uv run python "$t"
        done
      - |
        uv run python << 'PYEOF'
        from apple_mail_mcp import mcp
        n = len(mcp._tool_manager._tools)
        assert n == 38, "Expected 38 tools, got %d" % n
        print("OK: %d tools registered" % n)
        PYEOF

  - name: release
    image: dhi.io/node:26.4.0-alpine3.24-dev@sha256:6049c9bf9906b19c05596189887b19905471a0a88d555fc76db55ff23ee79a5a
    depends_on:
      - lint
      - check
    when:
      - event: push
        branch: main
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
      GH_TOKEN:
        from_secret: github_token
    commands:
      - apk add --no-cache git
      - git config user.name "woodpecker[bot]"
      - git config user.email "woodpecker@m0sh1.cc"
      - git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/isityael/apple-mail-mcp.git"
      - git fetch --tags origin
      - npm ci
      - npx semantic-release

  - name: build-mcpb
    image: dhi.io/alpine-base:3.24-dev@sha256:74230b37711de2e5cbc42b8fbd0bb019417ce99b05e5792390d75cb6c948a560
    depends_on:
      - lint
      - check
    commands:
      - apk add --no-cache bash zip unzip jq
      - |
        if [ -n "${CI_COMMIT_TAG}" ]; then
          export APPLE_MAIL_MCP_VERSION="${CI_COMMIT_TAG#v}"
          echo "Building tagged release ${APPLE_MAIL_MCP_VERSION}"
        fi
      - bash apple-mail-mcpb/build-mcpb.sh
      - |
        n=$(jq '.tools | length' apple-mail-mcpb/manifest.json)
        [ "$n" -eq 38 ] || { echo "ERROR: Expected 38 tools, got $n"; exit 1; }
        echo "OK: $n tools in manifest"
      - |
        if [ -n "${CI_COMMIT_TAG}" ]; then
          MCPB="apple-mail-mcp-${CI_COMMIT_TAG}.mcpb"
          test -f "$MCPB" || { echo "Missing tagged build artifact: $MCPB"; exit 1; }
          VERSION="${CI_COMMIT_TAG#v}"
          unzip -p "$MCPB" manifest.json | jq -e --arg v "$VERSION" '.version == $v'
          unzip -p "$MCPB" pyproject.toml | grep -F "version = \"$VERSION\""
          unzip -p "$MCPB" uv.lock | grep -F "version = \"$VERSION\""
          unzip -p "$MCPB" apple_mail_mcp/__init__.py | grep -F "__version__ = \"$VERSION\""
          sha256sum "$MCPB" > "$MCPB.sha256"
        else
          echo "Non-tag build: skipping release asset checksum generation"
        fi

  - name: github-release
    image: dhi.io/alpine-base:3.24-dev@sha256:74230b37711de2e5cbc42b8fbd0bb019417ce99b05e5792390d75cb6c948a560
    depends_on:
      - build-mcpb
    when:
      - event: tag
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - apk add --no-cache -X https://dl-cdn.alpinelinux.org/alpine/v3.24/community git github-cli
      - |
        export GH_TOKEN="${GITHUB_TOKEN}"
        MCPB="apple-mail-mcp-${CI_COMMIT_TAG}.mcpb"
        test -f "$MCPB" || { echo "Missing: $MCPB"; exit 1; }
        test -f "$MCPB.sha256" || { echo "Missing: $MCPB.sha256"; exit 1; }
        REPO="isityael/apple-mail-mcp"

        assets="$(gh release view "${CI_COMMIT_TAG}" --repo "$REPO" --json assets --jq '.assets[].name' || true)"
        has_mcpb=false
        has_sha=false
        echo "$assets" | grep -Fx "$MCPB" >/dev/null && has_mcpb=true
        echo "$assets" | grep -Fx "$MCPB.sha256" >/dev/null && has_sha=true

        if [ "$has_mcpb" = true ] && [ "$has_sha" = true ]; then
          echo "Release assets already present; skipping upload"
        else
          gh release upload "${CI_COMMIT_TAG}" "$MCPB" "$MCPB.sha256" --repo "$REPO"
        fi

        is_draft="$(gh release view "${CI_COMMIT_TAG}" --repo "$REPO" --json isDraft --jq '.isDraft')"
        if [ "$is_draft" = "true" ]; then
          gh release edit "${CI_COMMIT_TAG}" --repo "$REPO" --draft=false
        else
          echo "Release is already published"
        fi

  - name: update-homebrew
    image: dhi.io/alpine-base:3.24-dev@sha256:74230b37711de2e5cbc42b8fbd0bb019417ce99b05e5792390d75cb6c948a560
    depends_on:
      - github-release
    when:
      - event: tag
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - apk add --no-cache -X https://dl-cdn.alpinelinux.org/alpine/v3.24/community curl github-cli jq
      - |
        export GH_TOKEN="$GITHUB_TOKEN"
        VERSION="$(echo "$CI_COMMIT_TAG" | sed 's/^v//')"
        TARBALL_URL="https://github.com/isityael/apple-mail-mcp/archive/refs/tags/$CI_COMMIT_TAG.tar.gz"
        echo "Fetching SHA256 for $TARBALL_URL..."
        SHA256=$(curl -sL "$TARBALL_URL" | sha256sum | cut -d' ' -f1)
        echo "Version=$VERSION SHA256=$SHA256"

        TAP_REPO="isityael/tap"
        FILE_PATH="Formula/apple-mail-mcp.rb"

        # Fetch current file content and SHA
        FILE_DATA=$(gh api "repos/$TAP_REPO/contents/$FILE_PATH" --jq '{sha: .sha, content: .content}')
        FILE_SHA=$(echo "$FILE_DATA" | jq -r .sha)
        CONTENT=$(echo "$FILE_DATA" | jq -r .content | base64 -d)

        # Update URL and SHA256 in formula
        UPDATED=$(echo "$CONTENT" \
          | sed "s|url \"https://github.com/isityael/apple-mail-mcp/archive/refs/tags/v.*\.tar\.gz\"|url \"https://github.com/isityael/apple-mail-mcp/archive/refs/tags/$CI_COMMIT_TAG.tar.gz\"|" \
          | sed "s|sha256 \"[a-f0-9]\{64\}\"|sha256 \"$SHA256\"|")

        # Skip if no changes
        if [ "$CONTENT" = "$UPDATED" ]; then
          echo "No changes needed"
          exit 0
        fi

        # Commit via GitHub API
        ENCODED=$(echo "$UPDATED" | base64 | tr -d '\n')
        jq -n \
          --arg message "chore(apple-mail-mcp): bump to $VERSION" \
          --arg content "$ENCODED" \
          --arg sha "$FILE_SHA" \
          '{
            message: $message,
            content: $content,
            sha: $sha,
            committer: {
              name: "Woodpecker CI",
              email: "ci@m0sh1.cc"
            }
          }' \
          | gh api "repos/$TAP_REPO/contents/$FILE_PATH" --method PUT --input -
        echo "Updated $FILE_PATH to $VERSION"
