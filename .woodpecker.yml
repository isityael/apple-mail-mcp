when:
  - event: manual
  - event: [push, pull_request]
    branch: main
  - event: tag

steps:
  - name: lint
    image: dhi.io/uv:0.12.0-debian13-dev@sha256:f822b7116e857aaf8dc43ac4aae3b6d8767686d8ea9e1cbc0647f36ebf061591
    environment:
      UV_PROJECT_ENVIRONMENT: /tmp/venv
    commands:
      - uv sync --frozen
      - uv run ruff check .
      - uv run ruff format --check .

  - name: check
    image: dhi.io/uv:0.12.0-debian13-dev@sha256:f822b7116e857aaf8dc43ac4aae3b6d8767686d8ea9e1cbc0647f36ebf061591
    environment:
      UV_PROJECT_ENVIRONMENT: /tmp/venv
    commands:
      - uv sync --frozen
      - uv run python -c "import apple_mail_mcp"
      - uv run python scripts/check_versions.py
      - uv run python scripts/check_mcpb_manifest.py
      - uv run python scripts/check_codex_plugin_export.py
      - |
        for t in tests/test_*.py; do
          uv run python "$t"
        done
      - |
        uv run python << 'PYEOF'
        from apple_mail_mcp import mcp
        n = len(mcp._tool_manager._tools)
        assert n == 38, "Expected 38 tools, got %d" % n
        print("OK: %d tools registered" % n)
        PYEOF

  - name: release
    image: dhi.io/node:26.4.0-alpine3.24-dev@sha256:6049c9bf9906b19c05596189887b19905471a0a88d555fc76db55ff23ee79a5a
    depends_on:
      - lint
      - check
    when:
      - event: push
        branch: main
    environment:
      GITEA_TOKEN:
        from_secret: forgejo_token
      GITEA_URL: "https://git.m0sh1.cc"
    commands:
      - apk add --no-cache git
      - git config user.name "woodpecker[bot]"
      - git config user.email "woodpecker@m0sh1.cc"
      - git config credential.helper "store --file=/tmp/forgejo-git-credentials"
      - trap 'rm -f /tmp/forgejo-git-credentials' EXIT
      - 'printf "protocol=https\nhost=git.m0sh1.cc\nusername=woodpecker\npassword=%s\n\n" "$GITEA_TOKEN" | git credential approve'
      - git remote set-url origin "https://git.m0sh1.cc/isityael/apple-mail-mcp.git"
      - git fetch --tags origin
      - npm ci --ignore-scripts
      - npx semantic-release

  - name: build-mcpb
    image: dhi.io/alpine-base:3.24-dev@sha256:bc485a80d08683238c792a82331064d2cccafeb724d65a7b049a623db834b547
    depends_on:
      - lint
      - check
    commands:
      - apk add --no-cache bash zip unzip jq
      - |
        if [ -n "${CI_COMMIT_TAG}" ]; then
          export APPLE_MAIL_MCP_VERSION="${CI_COMMIT_TAG#v}"
          echo "Building tagged release ${APPLE_MAIL_MCP_VERSION}"
        fi
      - bash apple-mail-mcpb/build-mcpb.sh
      - |
        n=$(jq '.tools | length' apple-mail-mcpb/manifest.json)
        [ "$n" -eq 38 ] || { echo "ERROR: Expected 38 tools, got $n"; exit 1; }
        echo "OK: $n tools in manifest"
      - |
        if [ -n "${CI_COMMIT_TAG}" ]; then
          MCPB="apple-mail-mcp-${CI_COMMIT_TAG}.mcpb"
          test -f "$MCPB" || { echo "Missing tagged build artifact: $MCPB"; exit 1; }
          VERSION="${CI_COMMIT_TAG#v}"
          unzip -p "$MCPB" manifest.json | jq -e --arg v "$VERSION" '.version == $v'
          unzip -p "$MCPB" pyproject.toml | grep -F "version = \"$VERSION\""
          unzip -p "$MCPB" uv.lock | grep -F "version = \"$VERSION\""
          unzip -p "$MCPB" apple_mail_mcp/__init__.py | grep -F "__version__ = \"$VERSION\""
          sha256sum "$MCPB" > "$MCPB.sha256"
        else
          echo "Non-tag build: skipping release asset checksum generation"
        fi

  - name: forgejo-release-assets
    image: dhi.io/alpine-base:3.24-dev@sha256:bc485a80d08683238c792a82331064d2cccafeb724d65a7b049a623db834b547
    depends_on:
      - build-mcpb
    when:
      - event: tag
    environment:
      GITEA_TOKEN:
        from_secret: forgejo_token
    commands:
      - apk add --no-cache curl jq
      - |
        MCPB="apple-mail-mcp-${CI_COMMIT_TAG}.mcpb"
        test -f "$MCPB" || { echo "Missing: $MCPB"; exit 1; }
        test -f "$MCPB.sha256" || { echo "Missing: $MCPB.sha256"; exit 1; }
        API="https://git.m0sh1.cc/api/v1/repos/isityael/apple-mail-mcp"

        RELEASE=""
        for ATTEMPT in 1 2 3 4 5 6; do
          if RELEASE="$(curl -fsS -H "Authorization: token $GITEA_TOKEN" "$API/releases/tags/$CI_COMMIT_TAG")"; then
            break
          fi
          echo "Release not available yet (attempt $ATTEMPT/6)"
          sleep 5
        done
        test -n "$RELEASE" || { echo "Release $CI_COMMIT_TAG was not created"; exit 1; }
        RELEASE_ID="$(echo "$RELEASE" | jq -er '.id')"
        ASSETS="$(echo "$RELEASE" | jq -r '.assets[].name')"

        for ASSET in "$MCPB" "$MCPB.sha256"; do
          if echo "$ASSETS" | grep -Fx "$ASSET" >/dev/null; then
            echo "$ASSET already uploaded; skipping"
            continue
          fi
          curl -fsS \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$ASSET" \
            "$API/releases/$RELEASE_ID/assets?name=$ASSET" >/dev/null
          echo "Uploaded $ASSET"
        done

  - name: update-homebrew
    image: dhi.io/alpine-base:3.24-dev@sha256:bc485a80d08683238c792a82331064d2cccafeb724d65a7b049a623db834b547
    depends_on:
      - forgejo-release-assets
    when:
      - event: tag
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - apk add --no-cache -X https://dl-cdn.alpinelinux.org/alpine/v3.24/community curl github-cli jq
      - |
        export GH_TOKEN="$GITHUB_TOKEN"
        VERSION="$(echo "$CI_COMMIT_TAG" | sed 's/^v//')"
        TARBALL_URL="https://git.m0sh1.cc/isityael/apple-mail-mcp/archive/$CI_COMMIT_TAG.tar.gz"
        echo "Fetching SHA256 for $TARBALL_URL..."
        ARCHIVE="$(mktemp)"
        curl -fsSL -o "$ARCHIVE" "$TARBALL_URL"
        SHA256=$(sha256sum "$ARCHIVE" | cut -d' ' -f1)
        rm -f "$ARCHIVE"
        echo "Version=$VERSION SHA256=$SHA256"

        TAP_REPO="isityael/tap"
        FILE_PATH="Formula/apple-mail-mcp.rb"

        # Fetch current file content and SHA
        FILE_DATA=$(gh api "repos/$TAP_REPO/contents/$FILE_PATH" --jq '{sha: .sha, content: .content}')
        FILE_SHA=$(echo "$FILE_DATA" | jq -r .sha)
        CONTENT=$(echo "$FILE_DATA" | jq -r .content | base64 -d)

        # Update URL and SHA256 in formula
        UPDATED=$(echo "$CONTENT" \
          | sed "s|url \"https://git.m0sh1.cc/isityael/apple-mail-mcp/archive/v.*\.tar\.gz\"|url \"$TARBALL_URL\"|" \
          | sed "s|sha256 \"[a-f0-9]\{64\}\"|sha256 \"$SHA256\"|")

        # Skip if no changes
        if [ "$CONTENT" = "$UPDATED" ]; then
          echo "No changes needed"
          exit 0
        fi

        # Commit via GitHub API
        ENCODED=$(echo "$UPDATED" | base64 | tr -d '\n')
        jq -n \
          --arg message "chore(apple-mail-mcp): bump to $VERSION" \
          --arg content "$ENCODED" \
          --arg sha "$FILE_SHA" \
          '{
            message: $message,
            content: $content,
            sha: $sha,
            committer: {
              name: "Woodpecker CI",
              email: "ci@m0sh1.cc"
            }
          }' \
          | gh api "repos/$TAP_REPO/contents/$FILE_PATH" --method PUT --input -
        echo "Updated $FILE_PATH to $VERSION"
